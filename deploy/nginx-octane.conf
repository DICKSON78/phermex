# Nginx vhost for the Phermex API behind Laravel Octane (Swoole) on :8000.
# For MULTI-NODE: uncomment the extra upstream lines (private IPs of other app
# hosts) so this box load-balances across a pool; then point DNS/ALB at this box.

upstream octane {
    server 127.0.0.1:8000 keepalive 32;
    # server 10.0.0.2:8000 keepalive 32;
    # server 10.0.0.3:8000 keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name helix.co.tz www.helix.co.tz;
    root /var/www/pharmex-app/public;

    client_max_body_size 20m;

    # TLS: `certbot --nginx -d helix.co.tz -d www.helix.co.tz` will slot in here.

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_pass http://octane;
    }

    # Admin files (bug reports/prescription images) served via the storage symlink
    location ^~ /storage/ {
        try_files $uri @octane;
    }

    location @octane {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://octane;
    }
}