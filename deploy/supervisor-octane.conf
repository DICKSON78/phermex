; Supervisor config for Laravel Octane (Swoole). Drop into /etc/supervisor/conf.d/octane.conf
[program:octane]
command=/usr/bin/php /var/www/pharmex-app/artisan octane:start --server=swoole --host=127.0.0.1 --port=8000 --workers=auto --max-requests=1000
directory=/var/www/pharmex-app
user=www-data
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/octane.log
stderr_logfile=/var/log/octane-error.log
environment=APP_ENV="production"

; Supervisor config for the Redis queue worker(s). Add to the same file or a new one.
[program:queue]
command=/usr/bin/php /var/www/pharmex-app/artisan queue:work redis --sleep=2 --tries=3 --timeout=90
directory=/var/www/pharmex-app
user=www-data
process_name=%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/queue.log
stderr_logfile=/var/log/queue-error.log